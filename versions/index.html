<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Versions">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../apple-touch-icon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Strategy versions · PAPER</title>
<style>
:root{
  --bg:#000; --c1:#111418; --c2:#1a1f25; --line:rgba(255,255,255,.08);
  --t:#f5f5f7; --t2:rgba(235,235,245,.58); --t3:rgba(235,235,245,.34);
  --g:#16e07a; --r:#ff4d5e; --cyan:#38d6f5; --y:#ffd60a; --orange:#ffa53a;
  --disp:-apple-system,"SF Pro Display",system-ui,sans-serif;
  --text:-apple-system,"SF Pro Text",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:16px/1.35 var(--text);
  min-height:100%;overflow-x:hidden}
body{padding-bottom:calc(36px + var(--safe-b))}
button,a{font:inherit;color:inherit}
button{background:none;border:0;padding:0}
a{text-decoration:none}
.num{font-variant-numeric:tabular-nums}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

.sticky{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.92);
  padding:calc(10px + var(--safe-t)) 16px 12px;border-bottom:1px solid var(--line);
  backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.back{font-weight:800;color:var(--cyan);padding:6px 2px;flex-shrink:0}
.brand b{display:block;font:800 17px/1.1 var(--disp);letter-spacing:-.02em}
.brand small{display:block;margin-top:2px;font-weight:700;font-size:10px;color:var(--t2);
  letter-spacing:.04em}
.paper{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;
  letter-spacing:.08em;border:1.5px solid rgba(255,214,10,.7);color:var(--y);
  border-radius:999px;padding:4px 8px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  background:#161616;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:#fff}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--g);
  box-shadow:0 0 0 0 rgba(22,224,122,.5);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(22,224,122,.45)}70%{box-shadow:0 0 0 8px rgba(22,224,122,0)}}

.wrap{padding:14px 14px 0;max-width:560px;margin:0 auto}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;font-size:13px;color:var(--t2)}
.sec b{color:#fff;font-size:15px}
.note{font-size:12px;color:var(--t2);line-height:1.45;margin:0 0 14px}

.hero{background:radial-gradient(120% 80% at 50% 0%,rgba(22,224,122,.16),transparent 55%),var(--c1);
  border:1px solid var(--line);border-radius:24px;padding:16px 16px 14px;margin:4px 0 14px;
  box-shadow:0 16px 50px rgba(0,0,0,.45);animation:rise .55s cubic-bezier(.2,1.3,.3,1)}
.hero.loss{background:radial-gradient(120% 80% at 50% 0%,rgba(255,77,94,.16),transparent 55%),var(--c1)}
.hero .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--t2)}
.hero .who{margin:6px 0 2px;font:800 22px/1.1 var(--disp)}
.hero .big{font:800 52px/1 var(--disp);letter-spacing:-1.4px;margin:4px 0 2px;
  font-variant-numeric:tabular-nums;transition:color .25s}
.hero .big.up{color:var(--g);text-shadow:0 0 24px rgba(22,224,122,.28)}
.hero .big.down{color:var(--r);text-shadow:0 0 24px rgba(255,77,94,.28)}
.hero .sub{color:var(--t2);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px}
.hero .sub b{color:var(--t)}
.crown{display:inline-block;margin-right:4px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

.board{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:10px;background:var(--c1);border:1px solid var(--line);
  border-radius:16px;padding:10px 12px;animation:rise .5s cubic-bezier(.2,1.3,.3,1) both}
.brow.lead{border-color:rgba(22,224,122,.45);box-shadow:0 0 0 1px rgba(22,224,122,.2),0 8px 28px rgba(22,224,122,.08)}
.brow.wait{opacity:.72}
.brow.wait .bpnl{color:var(--t3);font-weight:700;font-size:12px}
.brow.warm .bpnl{font-size:14px}
.brow.warm .bpnl .held{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);margin-top:2px}
.rank{width:22px;font:800 15px/1 var(--disp);color:var(--t3);flex-shrink:0}
.brow.lead .rank{color:var(--y)}
.blet{width:28px;height:28px;border-radius:9px;background:#1c1c20;display:flex;align-items:center;justify-content:center;
  font-weight:800;flex-shrink:0}
.bmid{flex:1;min-width:0}
.bmid b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmid s{display:block;text-decoration:none;font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpnl{font:800 16px/1 var(--disp);font-variant-numeric:tabular-nums;text-align:right;flex-shrink:0}
.up{color:var(--g)}.down{color:var(--r)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:800;
  letter-spacing:.04em;border:1px solid var(--line);color:var(--t2);margin-left:4px;white-space:nowrap}
.badge.yes{border-color:rgba(22,224,122,.4);color:var(--g);background:rgba(22,224,122,.08)}
.badge.no{border-color:rgba(255,77,94,.35);color:var(--r);background:rgba(255,77,94,.08)}
.badge.wait{border-color:rgba(255,165,58,.4);color:var(--orange);background:rgba(255,165,58,.08)}
.badge.lead{border-color:rgba(255,214,10,.5);color:var(--y)}

.mcard{background:var(--c1);border:1px solid var(--line);border-radius:24px;padding:14px;
  margin:0 0 14px;box-shadow:0 10px 40px rgba(0,0,0,.4);
  animation:rise .55s cubic-bezier(.2,1.3,.3,1) both;overflow:hidden}
.mcard.lead{border-color:rgba(22,224,122,.35)}
.mcard.flash-up{animation:wiggle .45s ease, glowg .7s ease}
.mcard.flash-dn{animation:wiggle .45s ease, glowr .7s ease}
@keyframes wiggle{0%,100%{transform:none}25%{transform:rotate(-0.6deg) scale(1.01)}75%{transform:rotate(.6deg)}}
@keyframes glowg{0%{box-shadow:0 0 0 0 rgba(22,224,122,0)}40%{box-shadow:0 0 28px rgba(22,224,122,.35)}100%{box-shadow:none}}
@keyframes glowr{0%{box-shadow:0 0 0 0 rgba(255,77,94,0)}40%{box-shadow:0 0 28px rgba(255,77,94,.35)}100%{box-shadow:none}}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.mname{font:800 18px/1.15 var(--disp)}
.mname .let{display:inline-flex;width:22px;height:22px;border-radius:7px;background:#1c1c20;
  align-items:center;justify-content:center;font-size:12px;margin-right:6px;vertical-align:2px}
.setting{margin:6px 0 10px;font-size:12px;color:var(--t2);line-height:1.4}
.eq{font:800 40px/1 var(--disp);letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:2px 0 4px;transition:color .25s}
.runbox{margin:6px 0 10px}
.run-start{font-size:16px;font-weight:800;color:var(--t2);letter-spacing:-.01em;line-height:1.25}
.run-now-label{font-size:16px;font-weight:800;color:var(--t2);margin:2px 0 0}
.run-now{font:800 38px/1.05 var(--disp);letter-spacing:-1.2px;font-variant-numeric:tabular-nums;margin:2px 0 4px;white-space:nowrap}
.run-chg{font:800 22px/1.2 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.run-note{font-size:12px;color:var(--t2);line-height:1.4;margin-top:6px}
.slipnote{font-size:13px;font-weight:700;line-height:1.4;margin:10px 0 0;padding:10px 12px;border-radius:14px;
  border:1px solid rgba(255,165,58,.5);color:#ffd59a;background:rgba(255,165,58,.1)}
.bmid .run{display:block;text-decoration:none;font-size:13px;font-weight:800;line-height:1.35;color:inherit;
  white-space:normal;margin:3px 0 2px;letter-spacing:-.01em}
.hero .run{font:800 15px/1.35 var(--disp);margin-top:8px;letter-spacing:-.02em;white-space:normal}
.eq.flash-up{animation:popn .45s ease;color:var(--g)}
.eq.flash-dn{animation:popn .45s ease;color:var(--r)}
@keyframes popn{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.pnlrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:10px;font-variant-numeric:tabular-nums}
.pnlrow .p{font:800 20px/1 var(--disp)}
.pnlrow .t2{color:var(--t2);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#0c0e11;border:1px solid var(--line);border-radius:14px;padding:9px 10px;min-width:0}
.tile .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.tile .v{font:800 16px/1.25 var(--disp);margin-top:3px;font-variant-numeric:tabular-nums}
.badgerow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.curve{display:block;width:100%;height:72px;margin:6px 0 4px}
.ocap{font-size:12px;font-weight:800;color:var(--t2);margin:10px 0 6px;letter-spacing:.06em;text-transform:uppercase}
.opos{display:flex;align-items:center;gap:10px;background:#0c0e11;border:1px solid var(--line);
  border-radius:14px;padding:8px 10px;margin:0 0 8px;color:inherit}
.opos canvas{width:72px;height:32px;flex-shrink:0}
.opos .nm{font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opos .held{font-size:11px;color:var(--t3)}
.opos .px{margin-left:auto;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0}
.trow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.trow:last-child{border-bottom:0}
.trow .nm{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .why{font-size:11px;color:var(--t3);text-transform:capitalize}
.empty{color:var(--t3);font-size:13px;padding:8px 0}
.meta{font-size:11px;color:var(--t2);font-weight:600;white-space:normal;word-break:break-word;line-height:1.35;margin-top:2px}
.eqsub{font-size:13px;font-weight:700;color:var(--t2);margin:-2px 0 8px;line-height:1.35}
.basis{font-size:12px;color:var(--t2);margin:8px 0 0;line-height:1.4}
.miss{font-size:11px;color:var(--t3);margin-top:2px}

.copybox{background:var(--c1);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin:0 0 18px}
.copybox pre{margin:10px 0 0;white-space:pre-wrap;word-break:break-word;font:12px/1.45 var(--text);
  color:var(--t2);max-height:220px;overflow:auto}
.copybtn{background:#fff;color:#000;font-weight:800;border-radius:999px;padding:7px 14px;font-size:13px}
.copybtn.ok{background:var(--g)}
.foot{font-size:11px;color:var(--t3);text-align:center;padding:8px 8px 20px;line-height:1.45}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .pulse{box-shadow:none}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header class="sticky">
  <div class="row">
    <div class="brand">
      <a class="back" id="back" href="../">‹ Desk</a>
      <div><b>Strategy versions</b><small id="ago">live paper board</small></div>
    </div>
    <div class="row" style="gap:6px">
      <span class="paper">PAPER</span>
      <span class="live"><i class="pulse"></i> Live</span>
    </div>
  </div>
</header>
<main class="wrap" id="app">
  <div class="note">Loading versions…</div>
</main>

<script>
(function () {
  const BUILD = "versions4-startnow";
  const h = new URLSearchParams(location.hash.slice(1));
  let DPATH = h.get("d") || localStorage.getItem("desk_d") || "";
  let TOKEN = h.get("t") || localStorage.getItem("desk_t") || "";
  if (h.get("d")) localStorage.setItem("desk_d", h.get("d"));
  if (h.get("t")) localStorage.setItem("desk_t", h.get("t"));
  const hash = location.hash || (DPATH ? ("#d=" + DPATH) : (TOKEN ? ("#t=" + TOKEN) : ""));
  document.getElementById("back").href = "../" + hash;
  const ROOT = location.pathname.replace(/\/versions\/?$/, "/");
  const reduce = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let prev = {};
  let lastAt = 0;
  let confettiDone = false;

  function usd(v, sign) {
    if (v == null || isNaN(v)) return "—";
    const n = Math.abs(v);
    const s = (n >= 100 ? n.toFixed(0) : n.toFixed(2)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    if (sign) return (v > 0 ? "+" : v < 0 ? "−" : "") + "$" + s;
    return (v < 0 ? "−" : "") + "$" + s;
  }
  function pct(v) {
    if (v == null || isNaN(v)) return "—";
    return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1) + "%";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function ago(ts) {
    const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
    if (s < 5) return "just now";
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    return Math.floor(s / 3600) + "h ago";
  }
  function held(ts) {
    if (!ts) return "";
    const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
    const m = Math.floor(s / 60), h = Math.floor(m / 60);
    if (h) return "⏱ In for " + h + "h " + (m % 60) + "m";
    return "⏱ In for " + m + "m";
  }
  function wr(v) { return v == null ? "—" : Math.round(v) + "%"; }
  function fmtMult(v) { return v == null ? "—" : (Number(v).toFixed(2) + "x"); }
  function fmtMc(v) {
    if (v == null || v === "") return "—";
    const n = Number(v);
    if (!isFinite(n)) return "—";
    if (n >= 1e6) return "$" + (n/1e6).toFixed(2) + "M";
    if (n >= 1e3) return "$" + (n/1e3).toFixed(0) + "k";
    return "$" + Math.round(n);
  }
  function cls(v) { return v > 0 ? "up" : v < 0 ? "down" : ""; }
  function money(v, sign) {
    if (v == null || isNaN(v)) return "—";
    const n = Number(v);
    const body = "$" + Math.abs(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
    if (sign) return (n > 0 ? "+" : n < 0 ? "−" : "") + body;
    return (n < 0 ? "−" : "") + body;
  }
  function startMoney(v) {
    if (v == null || isNaN(v)) return "—";
    const n = Number(v);
    const whole = Math.abs(n - Math.round(n)) < 0.001;
    const body = whole
      ? "$" + Math.abs(n).toLocaleString("en-US", {maximumFractionDigits: 0})
      : "$" + Math.abs(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
    return (n < 0 ? "−" : "") + body;
  }
  function runLine(v) {
    if (v && v.run_line) return v.run_line;
    const start = v.started_with, now = v.now_value, chg = v.change, pct = v.change_pct;
    if (start == null || now == null) return "";
    const pcts = (pct == null ? "—" : (pct > 0 ? "+" : pct < 0 ? "−" : "") + Math.abs(pct).toFixed(1) + "%");
    return "Started with " + startMoney(start) + " → now " + money(now) + " (" + money(chg, true) + ", " + pcts + ")";
  }
  function runBox(v) {
    const start = v.started_with, now = v.now_value, chg = v.change, pct = v.change_pct;
    const pcts = (pct == null ? "—" : (pct > 0 ? "+" : pct < 0 ? "−" : "") + Math.abs(pct).toFixed(1) + "%");
    return `<div class="runbox">
      <div class="run-start">Started with ${startMoney(start)}</div>
      <div class="run-now-label">→ now</div>
      <div class="run-now num ${cls(chg)}">${money(now)}</div>
      <div class="run-chg ${cls(chg)}">${money(chg, true)} · ${pcts}</div>
      ${v.start_note ? `<div class="run-note">${esc(v.start_note)}</div>` : ""}
      ${v.slip_note ? `<div class="slipnote">${esc(v.slip_note)}</div>` : ""}
    </div>`;
  }

  function spark(cv, pts, up) {
    if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 72, h = cv.clientHeight || 32;
    cv.width = w * dpr; cv.height = h * dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);
    if (!pts || pts.length < 2) {
      ctx.strokeStyle = "rgba(255,255,255,.15)";
      ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
      return;
    }
    const ys = pts.map(p => p.p != null ? p.p : p.v);
    let lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
    if (!(hi > lo)) { hi = lo + 1; lo = lo - 1; }
    const pad = 2;
    ctx.strokeStyle = up ? "#16e07a" : "#ff4d5e";
    ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    ys.forEach((y, i) => {
      const x = pad + (w - pad * 2) * i / (ys.length - 1);
      const py = h - pad - (h - pad * 2) * ((y - lo) / (hi - lo));
      i ? ctx.lineTo(x, py) : ctx.moveTo(x, py);
    });
    ctx.stroke();
  }

  function burst(x, y) {
    if (reduce()) return;
    const c = document.getElementById("fx");
    const dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
    const ctx = c.getContext("2d");
    ctx.scale(dpr, dpr);
    const colors = ["#16e07a", "#ffd60a", "#38d6f5", "#ffa53a", "#fff"];
    const parts = Array.from({ length: 80 }, () => ({
      x: x, y: y, vx: (Math.random() - 0.5) * 9, vy: Math.random() * -8 - 2,
      g: 0.18 + Math.random() * 0.1, s: 3 + Math.random() * 4,
      c: colors[(Math.random() * colors.length) | 0], a: 1, r: Math.random() * 6
    }));
    const t0 = performance.now();
    function tick(t) {
      const dt = Math.min(32, t - (tick._t || t)); tick._t = t;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      let live = false;
      parts.forEach(p => {
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.a -= 0.012;
        if (p.a <= 0) return;
        live = true;
        ctx.globalAlpha = Math.max(0, p.a);
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x, p.y, p.s, p.s * 0.6);
      });
      ctx.globalAlpha = 1;
      if (live && t - t0 < 1800) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
    requestAnimationFrame(tick);
  }

  function badges(v) {
    const enough = v.enough
      ? '<span class="badge yes">enough trades · ' + v.trades + '</span>'
      : '<span class="badge wait">need 50 trades · ' + v.trades + '/' + (v.need || 50) + '</span>';
    const prof = v.profitable
      ? '<span class="badge yes">profitable after fees · yes</span>'
      : '<span class="badge no">profitable after fees · no</span>';
    const lead = v.leader ? '<span class="badge lead">★ Leader</span>' : '';
    return lead + prof + enough;
  }

  function board(vs) {
    const ranked = vs.filter(v => v.trades).slice().sort((a, b) => {
      if (a.leader && !b.leader) return -1;
      if (b.leader && !a.leader) return 1;
      return (b.pnl - a.pnl) || (b.trades - a.trades);
    });
    const warming = vs.filter(v => !v.trades && v.open);
    const waiting = vs.filter(v => !v.trades && !v.open);
    const rows = ranked.concat(warming).concat(waiting);
    return rows.map((v, i) => {
      const warm = !v.trades && v.open;
      const wait = !v.trades && !v.open;
      const rank = v.leader ? '★' : (v.trades ? String(ranked.indexOf(v) + 1) : '—');
      let pnl;
      if (v.trades) pnl = `<div class="bpnl ${cls(v.pnl)}">${usd(v.pnl, true)}</div>`;
      else if (warm) pnl = `<div class="bpnl ${cls(v.unrealized)}">${usd(v.unrealized, true)}<div class="held">warming up</div></div>`;
      else pnl = `<div class="bpnl">waiting</div>`;
      return `
      <a class="brow ${v.leader ? 'lead' : ''} ${wait ? 'wait' : ''} ${warm ? 'warm' : ''}" href="#v-${esc(v.id)}" style="animation-delay:${i * 40}ms">
        <div class="rank">${rank}</div>
        <div class="blet">${esc(v.letter)}</div>
        <div class="bmid"><b>${esc(v.name)}</b><span class="run ${cls(v.change)}">Started with ${startMoney(v.started_with)}<br>→ now ${money(v.now_value)} (${money(v.change, true)}, ${v.change_pct == null ? "—" : (v.change_pct > 0 ? "+" : v.change_pct < 0 ? "−" : "") + Math.abs(v.change_pct).toFixed(1) + "%"})</span><s>${v.trades} trades · WR ${wr(v.win_rate)} · open ${v.open}</s></div>
        ${pnl}
      </a>`;
    }).join("");
  }

  function openRows(v) {
    if (!v.opens || !v.opens.length) return '<div class="empty">No open trades</div>';
    return v.opens.map(o => `
      <a class="opos" href="${esc(o.link || '#')}" target="_blank" rel="noopener">
        <div style="min-width:0;flex:1">
          <div class="nm">${esc(o.ticker)}${o.best_mult ? ' · ' + fmtMult(o.best_mult) : ''}</div>
          <div class="held" data-held="${o.opened_at || ''}"></div>
          ${o.whales != null || o.narrative ? `<div class="meta">${o.whales != null ? esc(o.whales) + ' whales' : ''}${o.whales != null && o.narrative ? ' · ' : ''}${o.narrative ? esc(o.narrative) : ''}</div>` : ''}
        </div>
        <canvas class="mini" data-spark="${esc(JSON.stringify(o.spark || []))}" data-up="${o.pnl >= 0 ? 1 : 0}"></canvas>
        <div class="px ${cls(o.pnl)}">${usd(o.pnl, true)}<div class="held">${pct(o.pct)}</div></div>
      </a>`).join("");
  }

  function recentRows(v) {
    if (!v.recent || !v.recent.length) return '<div class="empty">No closed trades yet</div>';
    return v.recent.map(r => `
      <div class="trow">
        <div class="nm">${esc(r.ticker)} <span class="why">${esc((r.reason || '').replace('_', ' '))}${r.best_mult ? ' · ' + fmtMult(r.best_mult) : ''}</span>
          ${r.whales != null || r.narrative ? `<div class="meta">${r.whales != null ? esc(r.whales) + ' whales' : ''}${r.whales != null && r.narrative ? ' · ' : ''}${r.narrative ? esc(r.narrative) : ''}</div>` : ''}
          ${r.peak_after_mcap ? `<div class="miss">after exit peaked at ${fmtMc(r.peak_after_mcap)}${r.entry_mcap ? ' (entered ' + fmtMc(r.entry_mcap) + ')' : ''}</div>` : ''}
        </div>
        <div class="${cls(r.pnl)} num">${usd(r.pnl, true)}</div>
      </div>`).join("");
  }

  function card(v, i) {
    return `<article class="mcard ${v.leader ? 'lead' : ''}" id="v-${esc(v.id)}" data-vid="${esc(v.id)}" style="animation-delay:${80 + i * 50}ms">
      <div class="mhead">
        <div class="mname">${v.leader ? '<span class="crown">★</span>' : ''}<span class="let">${esc(v.letter)}</span>${esc(v.name)}</div>
        <div class="live" style="font-size:10px">${v.telegram ? 'Telegram calls' : 'silent'}</div>
      </div>
      <div class="setting">${esc(v.short)}</div>
      ${runBox(v)}
      ${v.basis === "tickets" ? `<div class="eqsub">${v.trades && v.pnl_multiple != null ? fmtMult(v.pnl_multiple) + ' money risked' : '—'}${v.best_mult ? ' · best ' + fmtMult(v.best_mult) : ''}</div>` : ''}
      <div class="pnlrow">
        <span class="t2">today <b class="${cls(v.today_pnl)}">${usd(v.today_pnl, true)}</b></span>
        ${v.unrealized ? `<span class="t2">open mark <b class="${cls(v.unrealized)}">${usd(v.unrealized, true)}</b></span>` : ''}
      </div>
      <div class="badgerow">${badges(v)}</div>
      <div class="grid">
        <div class="tile"><div class="k">Win rate</div><div class="v">${wr(v.win_rate)}</div></div>
        <div class="tile"><div class="k">Trades</div><div class="v">${v.trades} closed · ${v.open} open</div></div>
        <div class="tile"><div class="k">Avg win</div><div class="v up">${v.avg_win == null ? '—' : usd(v.avg_win, true)}</div></div>
        <div class="tile"><div class="k">Avg loss</div><div class="v down">${v.avg_loss == null ? '—' : usd(v.avg_loss, true)}</div></div>
        <div class="tile"><div class="k">Fees + slip</div><div class="v">${usd(v.fees_slip)}</div></div>
        <div class="tile"><div class="k">Max drawdown</div><div class="v down">${usd(v.max_drawdown)}${v.max_drawdown_pct != null ? ' · ' + Math.abs(v.max_drawdown_pct).toFixed(1) + '%' : ''}</div></div>
      </div>
      ${v.bankroll_note ? `<div class="basis">${esc(v.bankroll_note)}</div>` : ''}
      ${v.missed_upside && v.missed_upside.length ? `<div class="ocap">Missed upside after exit</div>` + v.missed_upside.map(m => `<div class="trow"><div class="nm">${esc(m.ticker)} <span class="why">entered ${fmtMc(m.entry_mcap)} · later ${fmtMc(m.peak_after_mcap)}</span></div><div class="num">${m.multiple_after != null ? fmtMult(m.multiple_after) : ''}</div></div>`).join("") : ''}
      <div class="ocap">Equity curve</div>
      <canvas class="curve" data-curve="${esc(JSON.stringify(v.curve || []))}" data-up="${v.pnl >= 0 ? 1 : 0}"></canvas>
      <div class="ocap">Open now</div>
      ${openRows(v)}
      <div class="ocap">Recent trades</div>
      ${recentRows(v)}
    </article>`;
  }

  function render(data) {
    const vs = data.versions || [];
    const lead = data.leader_id ? vs.find(v => v.id === data.leader_id) : null;
    const app = document.getElementById("app");
    const morning = data.morning || "";
    const heroK = !lead ? 'No leader yet' : (lead.enough && lead.profitable ? 'Leader' : 'Early leader');
    const heroWho = !lead ? 'Waiting for trades' : ((lead.leader ? '<span class="crown">★</span>' : '') + esc(lead.letter + '  ' + lead.name));
    app.innerHTML = `
      <p class="note">${esc(data.note || "")}</p>
      <section class="hero ${lead && lead.pnl < 0 ? 'loss' : ''}">
        <div class="k">${heroK}</div>
        <div class="who">${heroWho}</div>
        <div class="big num ${lead ? cls(lead.pnl) : ''}">${lead ? usd(lead.pnl, true) : '—'}</div>
        ${lead && lead.run_line ? `<div class="run ${cls(lead.change)}">${esc(lead.run_line)}</div>` : ''}
        <div class="sub">
          <span>WR <b>${lead ? wr(lead.win_rate) : '—'}</b></span>
          <span><b>${lead ? lead.trades : 0}</b> trades</span>
          <span>equity <b>${lead ? usd(lead.equity) : '—'}</b></span>
          <span>${lead && lead.enough ? 'sample ready' : 'need 50 trades'}</span>
        </div>
      </section>
      <div class="sec"><b>Leaderboard</b><span>A–F: $350 start · G: $5 tickets · fees in</span></div>
      <div class="board">${board(vs)}</div>
      <div class="sec"><b>Morning summary</b><button class="copybtn" id="copy" type="button">Copy</button></div>
      <div class="copybox"><div class="t2" style="font-size:12px">Paste this into ChatGPT or Grok Bot each morning.</div>
        <pre id="morning">${esc(morning)}</pre></div>
      <div class="sec"><b>Every version</b><span>scroll · one page</span></div>
      ${vs.map((v, i) => card(v, i)).join("")}
      <div class="foot">PAPER only. Main is unchanged and is the only version that sends BUY/SELL calls. Moonshot uses its own $5 early-coin gate.
        Numbers refresh about every 5s. Need 50 closed trades before a result counts as proven.</div>
    `;
    app.querySelectorAll("canvas.curve").forEach(cv => spark(cv, JSON.parse(cv.dataset.curve || "[]"), cv.dataset.up === "1"));
    app.querySelectorAll("canvas.mini").forEach(cv => spark(cv, JSON.parse(cv.dataset.spark || "[]"), cv.dataset.up === "1"));
    tickHeld();
    const btn = document.getElementById("copy");
    if (btn) btn.onclick = async () => {
      const text = document.getElementById("morning").textContent || "";
      try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; btn.classList.add("ok"); }
      catch (e) { btn.textContent = "Select & copy"; }
      setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1600);
    };

    // flashes + confetti
    vs.forEach(v => {
      const was = prev[v.id];
      const el = app.querySelector('[data-vid="' + v.id + '"]');
      if (was && el) {
        if (v.pnl > was.pnl + 0.005) el.classList.add("flash-up");
        if (v.pnl < was.pnl - 0.005) el.classList.add("flash-dn");
        const eq = el.querySelector("[data-eq]");
        if (eq && was.equity != null && Math.abs(v.equity - was.equity) > 0.005) {
          eq.classList.add(v.equity >= was.equity ? "flash-up" : "flash-dn");
        }
        if (!reduce() && v.pnl - (was.pnl || 0) >= 5) {
          const r = el.getBoundingClientRect();
          burst(r.left + r.width / 2, r.top + 40);
        }
      }
      prev[v.id] = { pnl: v.pnl, equity: v.equity };
    });
    if (lead && lead.profitable && lead.enough && !confettiDone && !reduce()) {
      confettiDone = true;
      burst(innerWidth / 2, 160);
    }
  }

  function tickHeld() {
    document.querySelectorAll("[data-held]").forEach(el => {
      const ts = +el.getAttribute("data-held");
      if (ts) el.textContent = held(ts);
    });
    const agoEl = document.getElementById("ago");
    if (agoEl && lastAt) agoEl.textContent = "updated " + ago(lastAt);
  }

  async function load() {
    let data = null;
    try {
      if (TOKEN && !DPATH) {
        const r = await fetch("/api/versions", { cache: "no-store", headers: { Authorization: "Bearer " + TOKEN } });
        if (r.ok) data = await r.json();
      }
      if (!data && DPATH) {
        const url = ROOT + "d/" + encodeURIComponent(DPATH) + "/versions.json?_=" + Math.floor(Date.now() / 5000);
        const r = await fetch(url, { cache: "no-store" });
        if (r.ok) data = await r.json();
      }
      if (!data) {
        const r = await fetch("/api/versions", { cache: "no-store", headers: TOKEN ? { Authorization: "Bearer " + TOKEN } : {} });
        if (r.ok) data = await r.json();
      }
    } catch (e) { console.warn("versions load", e); }
    if (data && data.versions) {
      lastAt = data.generated_at || (Date.now() / 1000);
      render(data);
    } else {
      document.getElementById("app").innerHTML = '<div class="note">Waiting for versions data. Open this from the desk link (keep the #d= or #t= in the URL).</div>';
    }
  }

  setInterval(tickHeld, 1000);
  setInterval(load, 5000);
  load();
})();
</script>
</body>
</html>
