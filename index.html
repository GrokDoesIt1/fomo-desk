<title>Grok Bot · Desk</title>
<script>
/* One-time reload when desk-build changes. Never loops: session guard per build. Keeps #d=/#t= and desk_* storage. */
(function () {
  var BUILD = "68f7d29802cb";
  var META = "desk_build";
  var ONCE = "desk_bv_once";
  try {
    var prev = localStorage.getItem(META);
    if (prev == null) { localStorage.setItem(META, BUILD); return; }
    if (prev === BUILD) return;
    localStorage.setItem(META, BUILD);
    if (sessionStorage.getItem(ONCE) === BUILD) return;
    sessionStorage.setItem(ONCE, BUILD);
    var url = new URL(location.href);
    url.searchParams.set("_bv", BUILD);
    location.replace(url.toString());
  } catch (e) {}
})();
</script>
